# ==============================================================================
# SwiftSweeps Nginx Virtual Host Configuration Template
# ==============================================================================
# Operator setup:
# 1. Replace all `__PLACEHOLDER__` values before enabling in /etc/nginx/sites-available/:
#    - `__DOMAIN_NAME__`       (e.g. staging.example.com or app.example.com)
#    - `__APP_DIST_DIR__`      (e.g. /var/www/swiftsweeps/current/dist)
#    - `__SSL_CERT_PATH__`     (e.g. /etc/letsencrypt/live/<domain>/fullchain.pem)
#    - `__SSL_KEY_PATH__`      (e.g. /etc/letsencrypt/live/<domain>/privkey.pem)
# 2. Validate before reloading: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

upstream swiftsweeps_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Redirect all plain HTTP traffic to HTTPS (except ACME HTTP-01 challenges)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN_NAME__;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN_NAME__;

    server_tokens off;

    # TLS certificates provisioned externally (e.g., Certbot / ACME)
    ssl_certificate __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SwiftSweepsSSL:10m;
    ssl_session_tickets off;

    # Built Vite SPA directory (`npm run build` -> dist/)
    root __APP_DIST_DIR__;
    index index.html;

    # Default JSON request size matching REQUEST_BODY_LIMIT=1mb in server/config/env.ts
    client_max_body_size 1m;

    # Baseline security headers for static files
    # (Note: /api/ responses also receive API headers from Express security middleware)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # Server-Sent Events (SSE) realtime endpoints: disable buffering & extend read timeout
    # --------------------------------------------------------------------------
    location = /api/chat/stream {
        proxy_pass http://swiftsweeps_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location = /api/realtime/stream {
        proxy_pass http://swiftsweeps_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # Media upload routes matching server/app.ts per-route JSON limits (3mb / 4mb)
    # --------------------------------------------------------------------------
    location = /api/chat/attachments {
        client_max_body_size 3m;
        proxy_pass http://swiftsweeps_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/storage/upload {
        client_max_body_size 5m;
        proxy_pass http://swiftsweeps_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # API reverse proxy (loopback Express listener; Express uses TRUST_PROXY=loopback)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://swiftsweeps_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # Webhook reverse proxy (passes raw body/headers unmodified to loopback Node API;
    # currently no active webhook handlers exist so Express returns JSON 404 safely)
    # --------------------------------------------------------------------------
    location /webhooks/ {
        client_max_body_size 1m;
        proxy_pass http://swiftsweeps_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Hashed Vite build assets: never fall back to index.html on missing chunks
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker, web manifest, and HTML entry must revalidate on each release
    location ~* ^/(?:index\.html|sw\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA fallback for client-side routes (never applies to /api/, /webhooks/, or /assets/)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
