# ==============================================================================
# SwiftSweeps Nginx Configuration (`/etc/nginx/sites-available/default`)
# ==============================================================================
# Aligned with live VPS host:
# - Domains: swiftsweeps.net, www.swiftsweeps.net
# - Built Vite SPA directory (`npm run build` -> /var/www/myapp/dist)
# - Persistent Node API (`myapp-api.service`) on 127.0.0.1:4000
# - Certbot TLS certificates under /etc/letsencrypt/live/swiftsweeps.net/
#
# Validate before reloading: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

upstream myapp_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    server_name swiftsweeps.net www.swiftsweeps.net;

    root /var/www/myapp/dist;
    index index.html;

    server_tokens off;

    # Default JSON request size matching REQUEST_BODY_LIMIT=1mb in server/config/env.ts
    client_max_body_size 1m;

    # Canonicalize www -> apex so Better Auth `APP_ORIGIN=https://swiftsweeps.net`
    # and host-only HttpOnly Secure cookies stay on a single origin.
    # (If serving www directly instead, remove this block and add
    #  `TRUSTED_ORIGINS=https://www.swiftsweeps.net` in `/var/www/myapp/.env`.)
    if ($host = www.swiftsweeps.net) {
        return 301 https://swiftsweeps.net$request_uri;
    }

    # Baseline security headers for static files
    # (Note: /api/ responses also receive API headers from Express security middleware)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Do not serve hidden files (except ACME challenges)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # Server-Sent Events (SSE) realtime endpoints: disable buffering & extend read timeout
    # --------------------------------------------------------------------------
    location = /api/chat/stream {
        proxy_pass http://myapp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location = /api/realtime/stream {
        proxy_pass http://myapp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # Media upload routes matching server/app.ts per-route JSON limits (3mb / 4mb)
    # --------------------------------------------------------------------------
    location = /api/chat/attachments {
        client_max_body_size 3m;
        proxy_pass http://myapp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/storage/upload {
        client_max_body_size 5m;
        proxy_pass http://myapp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # Node.js API reverse proxy (Express uses TRUST_PROXY=loopback)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://myapp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Webhooks, if used by the application (passes raw body/headers unmodified)
    location /webhooks/ {
        client_max_body_size 1m;
        proxy_pass http://myapp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Hashed Vite build assets: never fall back to index.html on missing chunks
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Service worker, web manifest, and HTML entry must revalidate on each release
    location ~* ^/(?:index\.html|sw\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # React/Vite frontend and client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/swiftsweeps.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/swiftsweeps.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.swiftsweeps.net) {
        return 301 https://swiftsweeps.net$request_uri;
    } # managed by Certbot

    if ($host = swiftsweeps.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name swiftsweeps.net www.swiftsweeps.net;
    return 404; # managed by Certbot
}
